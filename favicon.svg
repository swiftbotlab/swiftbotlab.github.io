<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#FF4B47"/>
      <stop offset="0.55" stop-color="#E3242B"/>
      <stop offset="1" stop-color="#A3121A"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE9E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0008" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(36,46)">
  <!-- speed lines -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="520" x2="250" y2="520" stroke-width="34"/>
    <line x1="168" y1="606" x2="250" y2="606" stroke-width="34" opacity="0.75"/>
    <line x1="206" y1="692" x2="250" y2="692" stroke-width="34" opacity="0.55"/>
  </g>
  <g filter="url(#shadow)">
    <!-- lightning-bolt antenna -->
    <path d="M560 118 L470 300 L540 300 L492 418 L640 252 L566 252 L622 118 Z" fill="#FFFFFF"/>
    <!-- head -->
    <rect x="292" y="392" width="520" height="420" rx="120" fill="url(#face)"/>
    <!-- ears -->
    <rect x="252" y="532" width="56" height="140" rx="28" fill="#FFFFFF"/>
    <rect x="796" y="532" width="56" height="140" rx="28" fill="#FFFFFF"/>
  </g>
  <!-- visor -->
  <rect x="372" y="500" width="360" height="170" rx="85" fill="#1B0A0C"/>
  <!-- eyes -->
  <rect x="438" y="548" width="74" height="74" rx="37" fill="#FF4B47"/>
  <rect x="592" y="548" width="74" height="74" rx="37" fill="#FF4B47"/>
  <!-- smile -->
  <path d="M470 724 Q552 770 634 724" stroke="#E3242B" stroke-width="26" fill="none" stroke-linecap="round"/>
</g>
</svg>
